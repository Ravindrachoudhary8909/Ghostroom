<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Room - Dynamic Colors P2P</title>
    
    <!-- सुरक्षित और लाइव PeerJS लाइब्रेरी -->
    <script src="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        /* रूट वैरिएबल्स - थीम बदलने के लिए */
        :root {
            --primary-color: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.3);
            --gradient-start: #1e1b4b;
            --gradient-end: #3b0764;
            --chat-sent: linear-gradient(135deg, #6d28d9, #4c1d95);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #080b11;
            color: #e2e8f0;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            background: #0f1626;
            border-radius: 24px;
            box-shadow: 0 0 35px var(--primary-glow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
            border: 1px solid #2d3748;
            transition: all 0.3s ease;
        }
        .header {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: #e2e8f0;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #2d3748;
            transition: all 0.3s ease;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-color);
        }
        
        /* कलर पैलेट डिज़ाइन */
        .color-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 20px;
        }
        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: transform 0.2s;
        }
        .color-dot:hover {
            transform: scale(1.3);
        }
        
        .live-status {
            font-size: 11px;
            color: #10b981;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .connection-box {
            background: #172237;
            padding: 15px;
            border-bottom: 1px solid #2d3748;
        }
        .connection-box label {
            font-size: 11px;
            color: #9ca3af;
            display: block;
            margin-bottom: 6px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .id-display {
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            color: var(--primary-color);
            text-shadow: 0 0 5px var(--primary-glow);
            margin-bottom: 12px;
            border: 1px solid #374151;
            word-break: break-all;
            text-align: center;
            cursor: pointer;
        }
        .connect-form {
            display: flex;
            gap: 8px;
        }
        .connect-form input {
            flex: 1;
            padding: 10px 14px;
            background: #0b0f19;
            border: 1px solid #374151;
            color: white;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
        }
        .connect-form input:focus {
            border-color: var(--primary-color);
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }
        .btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--primary-color);
        }
        .btn:disabled {
            background: #4b5563;
            color: #9ca3af;
            cursor: not-allowed;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #0b0f19;
            background-image: radial-gradient(#1e293b 1px, transparent 0);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.sent {
            background: var(--chat-sent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            background: #1f2937;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
        }
        .message.system {
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-color);
            border: 1px solid var(--primary-glow);
            align-self: center;
            font-size: 12px;
            border-radius: 20px;
            padding: 5px 14px;
        }
        .chat-input-area {
            padding: 12px;
            background: #0f1626;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #2d3748;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: #172237;
            border: 1px solid #374151;
            color: white;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        .image-upload-btn {
            background: #172237;
            border: 1px solid #374151;
            color: var(--primary-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
        }
        #image-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>👻 GHOST ROOM</h1>
        
        <!-- कलर्स बदलने वाला पैलेट -->
        <div class="color-selector">
            <div class="color-dot" style="background: #8b5cf6;" onclick="changeTheme('purple')"></div>
            <div class="color-dot" style="background: #00f2fe;" onclick="changeTheme('blue')"></div>
            <div class="color-dot" style="background: #10b981;" onclick="changeTheme('green')"></div>
            <div class="color-dot" style="background: #ef4444;" onclick="changeTheme('red')"></div>
        </div>

        <div class="live-status">
            <div class="live-dot"></div>
            <span id="user-count-status">यूज़र लाइव: 1</span>
        </div>
    </div>
    
    <div class="connection-box">
        <label>आपकी सीक्रेट ID (टैप करके कॉपी करें):</label>
        <div class="id-display" id="my-id" onclick="copyMyId()">ID जनरेट हो रही है...</div>
        
        <div class="connect-form">
            <input type="text" id="peer-id-input" placeholder="सामने वाले भूत की ID यहाँ डालें">
            <button class="btn" id="connect-btn" onclick="connectToPeer()">कनेक्ट करें</button>
        </div>
    </div>

    <div class="chat-messages" id="chat-messages">
        <div class="message system">घोस्ट रूम एक्टिवेट हो गया है। थीम कलर सेलेक्ट करें।</div>
    </div>

    <div class="chat-input-area">
        <label for="image-input" class="image-upload-btn">🖼️</label>
        <input type="file" id="image-input" accept="image/*" onchange="sendImage(this)" disabled>
        
        <input type="text" id="message-input" placeholder="डार्क मैसेज टाइप करें..." onkeypress="handleKeyPress(event)" disabled>
        <button class="btn" id="send-btn" onclick="sendMessage()" disabled>भेजें</button>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    
    const myIdDisplay = document.getElementById('my-id');
    const peerIdInput = document.getElementById('peer-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const imageInput = document.getElementById('image-input');
    const chatMessages = document.getElementById('chat-messages');
